config firewall address
    edit "VB"
        set uuid dd999596-9a33-51f1-7cce-01822959140f
        set subnet 10.113.10.70 255.255.255.255
    next
    edit "BAD"
        set subnet 10.113.10.71 255.255.255.255
    next
    edit "NWNET"
        set subnet 10.113.10.0 255.255.255.0
    next
    edit "Hinemos"
        set uuid d5f6c746-9a33-51f1-b1aa-54eadc51b180
        set subnet 192.77.56.22 255.255.255.255
    next
    edit "ext-site"
        set type fqdn
        set fqdn "www.example.com"
    next
end
config firewall addrgrp
    edit "NWGRP"
        set member "VB"
    next
end
config firewall service custom
    edit "HTTP[8080]"
        set tcp-portrange 8080
    next
    edit "APP-RANGE"
        set tcp-portrange 9000-9010
    next
end
config firewall service group
    edit "WEB-ALL"
        set member "HTTPS" "APP-RANGE"
    next
end
config firewall policy
    edit 90
        set srcintf "port1"
        set dstintf "wan2"
        set action deny
        set srcaddr "BAD"
        set dstaddr "Hinemos"
        set service "ALL"
    next
    edit 100
        set uuid 90a5f332-9a34-51f1-93fe-7ef4bd16dcca
        set srcintf "port1"
        set dstintf "wan2"
        set action accept
        set srcaddr "NWGRP"
        set dstaddr "Hinemos"
        set schedule "always"
        set service "HTTP[8080]"
        set logtraffic all
        set comments "access-list Trust_access_in extended permit object HTTP[8080] object-group NWGRP_FASVR object Hinemos log notifications"
    next
    edit 110
        set srcintf "port1"
        set dstintf "wan2"
        set action accept
        set srcaddr "NWNET"
        set dstaddr "Hinemos"
        set service "WEB-ALL" "PING"
        set nat enable
        set utm-status enable
        set av-profile "default"
    next
    edit 120
        set srcintf "port1"
        set dstintf "wan2"
        set action accept
        set srcaddr "NWNET"
        set dstaddr "ext-site"
        set service "HTTPS"
    next
    edit 130
        set status disable
        set srcintf "port1"
        set dstintf "wan2"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
    next
end
config firewall vip
    edit "VIP-WEB"
        set extip 203.0.113.50
        set mappedip "192.168.100.10"
        set extintf "wan2"
        set portforward enable
        set extport 443
        set mappedport 8443
    next
end
config firewall policy
    edit 140
        set name "to-vip-web"
        set srcintf "wan2"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP-WEB"
        set service "HTTPS"
    next
end
